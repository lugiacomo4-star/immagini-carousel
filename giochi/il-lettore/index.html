<title>Il Lettore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: #0e1719;
    --bg-2: #142124;
    --line: #26393c;
    --ink: #e7ece6;
    --ink-2: #a9b8b3;
    --ink-3: #6f827e;
    --tea: #d9a441;
    --tea-soft: rgba(217, 164, 65, 0.14);
    --card: #ebe7da;
    --card-ink: #1d2624;
    --card-ink-2: #56605c;
    --lie: #e07a5f;
    --ok: #7fb89a;
    --display: "Instrument Serif", "Iowan Old Style", Georgia, "Songti SC", "Noto Serif SC", "Source Han Serif SC", serif;
    --body: "Figtree", system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); }
  body {
    color: var(--ink);
    font: 16px/1.55 var(--body);
    padding-inline: 16px;
    padding-block: 0 48px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  button { font: inherit; color: inherit; }
  button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--tea); outline-offset: 2px; }
  h1, h2, h3 { font-family: var(--display); font-weight: 400; text-wrap: balance; margin: 0; }
  .eyebrow { font: 500 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }

  /* Home */
  .home-hero { padding-block: 56px 28px; display: grid; gap: 14px; }
  .home-hero h1 { font-size: clamp(56px, 16vw, 88px); line-height: .9; letter-spacing: -.01em; }
  .home-hero h1 em { color: var(--tea); }
  .home-hero p { color: var(--ink-2); margin: 0; max-width: 34ch; font-size: 17px; }
  .rules { display: grid; gap: 10px; margin-block: 8px 28px; padding: 16px 0; border-block: 1px solid var(--line); }
  .rule { display: grid; grid-template-columns: 88px 1fr; gap: 12px; font-size: 14px; color: var(--ink-2); }
  .rule b { font: 500 12px/1.6 var(--mono); color: var(--tea); letter-spacing: .06em; text-transform: uppercase; }
  .case-list { display: grid; gap: 12px; }
  .case-btn {
    display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px;
    text-align: left; background: var(--bg-2); border: 1px solid var(--line); border-radius: 6px;
    padding: 18px; cursor: pointer; transition: border-color .15s;
  }
  .case-btn:hover { border-color: var(--tea); }
  .case-btn .n { font: 500 11px/1 var(--mono); color: var(--ink-3); letter-spacing: .12em; }
  .case-btn h3 { font-size: 28px; line-height: 1.1; margin-top: 6px; }
  .case-btn p { margin: 4px 0 0; color: var(--ink-2); font-size: 14px; }
  .stars { font: 500 14px/1 var(--mono); color: var(--tea); white-space: nowrap; }
  .stars .off { color: var(--line); }
  .draft-note { margin-top: 28px; color: var(--ink-3); font-size: 13px; }

  /* Case header */
  .top {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
    padding-block: 12px 0; border-bottom: 1px solid var(--line);
  }
  .top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .back { background: none; border: 0; color: var(--ink-2); cursor: pointer; padding: 6px 0; font-size: 14px; }
  .budgets { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .chip { font: 500 12px/1 var(--mono); padding: 7px 9px; border: 1px solid var(--line); border-radius: 99px; color: var(--ink-2); white-space: nowrap; }
  .chip b { color: var(--ink); font-weight: 500; }
  .chip.empty b { color: var(--lie); }
  .tabs { display: flex; gap: 4px; margin-top: 10px; overflow-x: auto; }
  .tab {
    background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 12px; cursor: pointer;
    color: var(--ink-3); font-weight: 600; font-size: 14px; white-space: nowrap;
  }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--tea); }
  .tab .count { font: 500 11px/1 var(--mono); color: var(--tea); margin-left: 4px; }

  .case-title { padding-block: 24px 8px; display: grid; gap: 8px; }
  .case-title h2 { font-size: clamp(34px, 9vw, 46px); line-height: 1; }
  .lede { color: var(--ink-2); margin: 0; }
  section.panel { display: grid; gap: 14px; padding-top: 16px; }
  .hint { font-size: 14px; color: var(--ink-3); margin: 0; }

  /* Details */
  .detail {
    display: grid; gap: 6px; text-align: left; width: 100%; cursor: pointer;
    background: var(--bg-2); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px;
  }
  .detail:hover:not([disabled]) { border-color: var(--tea); }
  .detail[disabled] { cursor: default; }
  .detail .lbl { font-weight: 600; display: flex; justify-content: space-between; gap: 10px; }
  .detail .lbl span { font: 500 11px/1.6 var(--mono); color: var(--ink-3); letter-spacing: .08em; text-transform: uppercase; }
  .detail .txt { color: var(--ink-2); font-size: 15px; }
  .detail.seen { border-color: var(--tea); background: var(--tea-soft); }
  .detail.locked { opacity: .45; }

  /* Suspects */
  .suspect { border: 1px solid var(--line); border-radius: 6px; background: var(--bg-2); overflow: hidden; }
  .suspect-head { padding: 16px; display: grid; gap: 4px; }
  .suspect-head h3 { font-size: 28px; line-height: 1.05; }
  .suspect-head .role { font: 500 11px/1.4 var(--mono); color: var(--ink-3); letter-spacing: .1em; text-transform: uppercase; }
  .suspect-head p { margin: 6px 0 0; color: var(--ink-2); font-size: 15px; }
  .suspect-body { display: grid; gap: 10px; padding: 0 16px 16px; }
  .act {
    text-align: left; background: none; border: 1px dashed var(--line); border-radius: 6px; padding: 11px 13px;
    cursor: pointer; color: var(--ink); font-size: 15px;
  }
  .act:hover:not([disabled]) { border-color: var(--tea); border-style: solid; }
  .act[disabled] { color: var(--ink-3); cursor: default; }
  .act .tag { display: block; font: 500 10px/1.6 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--tea); margin-bottom: 2px; }
  .exchange { display: grid; gap: 6px; padding: 12px 14px; border-left: 2px solid var(--tea); background: rgba(0,0,0,.18); }
  .exchange .q { color: var(--ink-3); font-size: 14px; }
  .exchange .a { font-family: var(--display); font-size: 20px; line-height: 1.3; }
  .exchange .a i { font-family: var(--body); font-style: normal; font-size: 14px; color: var(--ink-3); display: block; margin-top: 4px; }
  .reading { padding: 12px 14px; border-left: 2px solid var(--ok); background: rgba(0,0,0,.18); font-size: 15px; color: var(--ink-2); }
  .reading b { color: var(--ok); font: 500 10px/1.8 var(--mono); letter-spacing: .1em; text-transform: uppercase; display: block; }

  .bluff { border: 1px solid var(--tea); border-radius: 6px; padding: 16px; display: grid; gap: 10px; background: var(--tea-soft); }
  .bluff h3 { font-size: 26px; }
  .bluff p { margin: 0; color: var(--ink-2); font-size: 15px; }
  .btn {
    background: var(--tea); color: #1a1407; border: 0; border-radius: 6px; padding: 13px 18px;
    font-weight: 700; cursor: pointer; font-size: 15px; justify-self: start;
  }
  .btn.ghost { background: none; color: var(--ink); border: 1px solid var(--line); }
  .btn[disabled] { opacity: .4; cursor: default; }
  .reactions { display: grid; gap: 8px; }
  .reactions div { font-size: 15px; color: var(--ink); }
  .reactions b { color: var(--tea); font-weight: 600; }

  /* Notebook */
  .notebook { background: var(--card); color: var(--card-ink); border-radius: 4px; padding: 20px 18px; display: grid; gap: 0;
    background-image: repeating-linear-gradient(to bottom, transparent 0 35px, rgba(29,38,36,.1) 35px 36px); }
  .notebook h3 { font-size: 26px; margin-bottom: 6px; }
  .note { display: grid; grid-template-columns: 22px 1fr; gap: 8px; padding-block: 8px; font-size: 15px; line-height: 1.45; }
  .note .src { font: 500 10px/1.9 var(--mono); color: var(--card-ink-2); text-transform: uppercase; letter-spacing: .08em; }
  .note .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--card-ink-2); margin-top: 7px; }
  .note.lie .dot { background: var(--lie); }
  .empty-nb { color: var(--card-ink-2); font-style: italic; font-size: 15px; }

  /* Accuse */
  .pick { display: grid; gap: 8px; }
  .opt {
    text-align: left; background: var(--bg-2); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px;
    cursor: pointer; font-size: 15px;
  }
  .opt[aria-pressed="true"] { border-color: var(--tea); background: var(--tea-soft); }
  .opt small { display: block; color: var(--ink-3); font: 500 10px/1.8 var(--mono); letter-spacing: .08em; text-transform: uppercase; }

  /* Result */
  .result { padding-block: 32px 8px; display: grid; gap: 16px; }
  .verdict { font-family: var(--display); font-size: clamp(44px, 12vw, 64px); line-height: .95; }
  .verdict.bad { color: var(--lie); }
  .big-stars { font: 500 28px/1 var(--mono); color: var(--tea); letter-spacing: .1em; }
  .big-stars .off { color: var(--line); }
  .explain { background: var(--card); color: var(--card-ink); border-radius: 4px; padding: 18px; font-size: 15px; display: grid; gap: 10px; }
  .explain p { margin: 0; }
  .score-lines { display: grid; gap: 6px; font-size: 14px; color: var(--ink-2); }
  .score-lines div::before { content: "— "; color: var(--ink-3); }
  .share-box { width: 100%; min-height: 110px; background: var(--bg-2); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 12px; font: 13px/1.5 var(--mono); resize: none; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .toast { font-size: 14px; color: var(--ok); min-height: 1.4em; }

  @media (prefers-reduced-motion: no-preference) {
    .reveal { animation: rise .35s ease-out both; }
    @keyframes rise { from { transform: translateY(6px); opacity: .3; } to { transform: none; opacity: 1; } }
  }

  /* Daily */
  .daily { display: grid; gap: 10px; text-align: left; width: 100%; cursor: pointer; padding: 22px 18px; border-radius: 6px;
    background: var(--tea-soft); border: 1px solid var(--tea); }
  .daily .n { font: 500 11px/1 var(--mono); color: var(--tea); letter-spacing: .14em; }
  .daily h3 { font-size: clamp(32px, 9vw, 42px); line-height: 1; }
  .daily p { margin: 0; color: var(--ink-2); font-size: 15px; }
  .daily-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .countdown { font: 500 12px/1 var(--mono); color: var(--ink-3); }
  .list-head { margin-top: 32px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .list-head h2 { font-size: 28px; }

  /* Pressure */
  .pressure { display: flex; align-items: center; gap: 6px; font: 500 10px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin-top: 8px; }
  .pressure i { width: 9px; height: 9px; border-radius: 50%; border: 1px solid var(--ink-3); display: inline-block; }
  .pressure i.on { background: var(--lie); border-color: var(--lie); }
  .lawyer { font-size: 14px; color: var(--lie); padding: 10px 12px; border: 1px solid rgba(224,122,95,.4); border-radius: 6px; }

  /* Confront */
  button.note { text-align: left; width: 100%; background: none; border: 0; border-radius: 4px; cursor: pointer; color: inherit; font: inherit; padding-inline: 6px; margin-inline: -6px; }
  button.note[aria-pressed="true"] { background: rgba(217,164,65,.28); outline: 1px solid #b07f22; }
  .confront-bar { position: sticky; bottom: 0; padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--bg); border-top: 1px solid var(--line); display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .confront-bar span { font-size: 14px; color: var(--ink-2); }
  .flash { padding: 14px; border-radius: 6px; font-size: 15px; display: grid; gap: 6px; }
  .flash.hit { border-left: 2px solid var(--lie); background: rgba(0,0,0,.2); }
  .flash.hit .a { font-family: var(--display); font-size: 21px; line-height: 1.3; }
  .flash.hit i { font-style: normal; color: var(--ink-3); font-size: 14px; }
  .flash.miss { color: var(--ink-2); border: 1px dashed var(--line); }

  .hero-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .lang { background: none; border: 1px solid var(--line); border-radius: 99px; color: var(--ink-2); padding: 6px 12px; cursor: pointer; font-size: 13px; }
  .lang:hover { border-color: var(--tea); color: var(--ink); }
  :lang(zh-CN) body { line-height: 1.7; }

  /* Immagini (compaiono solo se generate) */
  .cover { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 6px; display: block; max-width: 100%; }
  .case-title .cover { margin-bottom: 6px; filter: saturate(.9); }
  .thumb { width: 72px; height: 72px; object-fit: cover; border-radius: 4px; }
  .case-btn.has-thumb { grid-template-columns: 72px 1fr auto; }
  .daily .cover { margin-bottom: 4px; }
  .suspect-head.has-portrait { grid-template-columns: 84px 1fr; column-gap: 14px; }
  .suspect-head.has-portrait > :not(.portrait) { grid-column: 2; }
  .portrait { grid-row: 1 / span 4; width: 84px; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 4px; max-width: 100%; }
</style>

<div class="wrap" id="app"></div>

<script src="cases.js"></script>

    select: n => `选出两条对不上的笔记（${n}/2）`, ready: "可以对质了", confront: "对质",
    accHint: "选出凶手、能钉死他的证据，以及动机。证据只能从你的笔记本里选。",
    culprit: "凶手是", proof: "关键证据", emptyProof: "笔记本是空的：没有证据，你只能瞎猜。",
    motive: "动机", firstOnly: "只有第一次指控算数，星星不能重来。", accuse: "指控",
    srcScene: "现场", srcRead: n => `${n}，观察`, srcAsk: n => `${n}，问询`, srcX: "矛盾",
    shareHead: (d, n, t) => d ? `🧠 读心者 第 ${n} 号` : `🧠 读心者 · ${t}`, wrongShare: "❌ 我指控错了人",
    challenge: "你能一次就破案吗？", caught: "抓到了。", innocent: "抓错人了。",
    rightC: n => `凶手正确：${n}`, wrongC: n => `你指控错了人。真凶是 ${n}。`,
    proofOk: "关键证据选对了。", proofNo: "你选的证据还不足以定罪。",
    whyOk: "动机正确。", whyNo: m => `动机错了。真正的动机是：${m}`, used: (a, b) => `用掉的提问：${a} / ${b}。`,
    offRank: n => `不计入成绩：只算第一次（${n} 星）。`,
    xFound: (a, b) => `发现的矛盾：${a} / ${b}。`, how: "真相", dare: "挑战朋友",
    copy: "复制结果", retry: "重玩本案", selected: "文字已选中：复制后粘贴到聊天里。",
    copied: "已复制。连同游戏链接一起发到聊天里吧。", other: "Italiano"
  }
};
const T = I18N[LANG];
const BUDGET = { eye: 4, questions: 6, hard: 2 };
const START = new Date(2026, 8, 25); // giorno del caso n. 1

const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const app = document.getElementById("app");
let S = null;
let tick = null;

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function starStr(n) { return "★".repeat(n) + '<span class="off">' + "★".repeat(3 - n) + "</span>"; }
function pic(c, sid) { return c.img && c.img.suspects && c.img.suspects[sid]; }
function first(s) { return s.name.split(" ")[0]; }
function dayIndex() {
  const now = new Date(), today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.max(0, Math.round((today - START) / 864e5));
}
function untilMidnight() {
  const now = new Date(), next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
  const m = Math.ceil((next - now) / 6e4);
  return `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, "0")} min`;
}

function setLang(l) {
  try { localStorage.setItem("lettore-lang", l); } catch (e) {}
  location.hash = l;
  location.reload();
}

function home() {
  S = null;
  clearInterval(tick);
  if (!CASES.length) { app.innerHTML = `<p class="lede" style="padding-top:48px">${T.load}</p>`; return; }
  const best = Object.fromEntries(Object.entries(store.get("lettore-first") || {}).map(([k, v]) => [k, v.stars]));
  const di = dayIndex(), today = di % CASES.length;
  const released = [], preview = [];
  CASES.forEach((c, i) => {
    if (i === today) return;
    (i < Math.min(di, CASES.length) ? released : preview).push(i);
  });
  released.reverse();
  const card = i => {
    const c = CASES[i];
    return `<button class="case-btn ${c.img && c.img.cover ? "has-thumb" : ""}" data-case="${i}">
      ${c.img && c.img.cover ? `<img class="thumb" src="${c.img.cover}" alt="">` : ""}
      <div>
        <div class="n">${esc(c.place.toUpperCase())}</div>
        <h3>${esc(c.title)}</h3>
        <p>${esc(c.teaser)}</p>
      </div>
      <div class="stars" aria-label="${T.stars(best[c.id] || 0)}">${starStr(best[c.id] || 0)}</div>
    </button>`;
  };
  const t = CASES[today];
  app.innerHTML = `
    <header class="home-hero">
      <div class="hero-top"><span class="eyebrow">${T.eyebrow}</span>${window.CASES_ZH ? `<button class="lang" id="lang">${T.other}</button>` : ""}</div>
      <h1>${T.h1}</h1>
      <p>${T.tagline}</p>
    </header>
    <button class="daily" data-case="${today}" data-daily="1">
      ${t.img && t.img.cover ? `<img class="cover" src="${t.img.cover}" alt="">` : ""}
      <span class="n">${T.daily(di + 1)}</span>
      <h3>${esc(t.title)}</h3>
      <p>${esc(t.teaser)}</p>
      <div class="daily-foot">
        <span class="stars">${starStr(best[t.id] || 0)}</span>
        <span class="countdown" id="cd">${T.next(untilMidnight())}</span>
      </div>
    </button>
    <div class="rules">
      <div class="rule"><b>${T.rEye(BUDGET.eye)}</b><span>${T.rEyeT(BUDGET.eye)}</span></div>
      <div class="rule"><b>${T.rQ(BUDGET.questions)}</b><span>${T.rQT(BUDGET.questions)}</span></div>
      <div class="rule"><b>${T.rP}</b><span>${T.rPT(BUDGET.hard)}</span></div>
      <div class="rule"><b>${T.rC}</b><span>${T.rCT}</span></div>
      <div class="rule"><b>${T.rA}</b><span>${T.rAT}</span></div>
      <div class="rule"><b>${T.rB}</b><span>${T.rBT}</span></div>
    </div>
    ${released.length ? `<div class="list-head"><h2>${T.archive}</h2><span class="eyebrow">${T.nCases(released.length)}</span></div><div class="case-list">${released.map(card).join("")}</div>` : ""}
    ${preview.length ? `<div class="list-head"><h2>${T.coming}</h2><span class="eyebrow">${T.preview}</span></div><div class="case-list">${preview.map(card).join("")}</div>` : ""}
    <p class="draft-note">${T.draft(CASES.length)}</p>`;
  const lb = app.querySelector("#lang");
  if (lb) lb.onclick = () => setLang(LANG === "zh" ? "it" : "zh");
  app.querySelectorAll("[data-case]").forEach(b => b.onclick = () => start(+b.dataset.case, !!b.dataset.daily));
  tick = setInterval(() => { const el = document.getElementById("cd"); if (el) el.textContent = T.next(untilMidnight()); }, 30000);
  window.scrollTo(0, 0);
}

function start(i, daily) {
  clearInterval(tick);
  S = { i, daily, num: dayIndex() + 1, c: CASES[i], tab: "scena", seen: [], read: [], asked: [], found: [], wrong: 0,
        bluff: false, sel: [], flash: null, accuse: { who: null, ev: null, mo: null } };
  render();
  window.scrollTo(0, 0);
}

const used = () => S.asked.length + S.wrong;
const hardCount = sid => S.c.suspects.find(s => s.id === sid).questions.filter(q => q.req && S.asked.includes(q.id)).length;

function notes() {
  const c = S.c, out = [];
  c.details.forEach(d => { if (S.seen.includes(d.id)) out.push({ id: d.id, src: T.srcScene, text: d.insight }); });
  c.suspects.forEach(s => {
    if (S.read.includes(s.id)) out.push({ id: "t_" + s.id, src: T.srcRead(first(s)), text: s.tell });
    s.questions.forEach(q => { if (S.asked.includes(q.id) && q.insight) out.push({ id: q.id, src: T.srcAsk(first(s)), text: q.insight }); });
  });
  c.contradictions.forEach(x => { if (S.found.includes(x.id)) out.push({ id: x.id, src: T.srcX, text: x.insight }); });
  return out;
}
function have(id) {
  if (id.startsWith("t_")) return S.read.includes(id.slice(2));
  return S.seen.includes(id) || S.asked.includes(id) || S.found.includes(id);
}

function render() {
  const c = S.c;
  const eyeLeft = BUDGET.eye - S.seen.length, qLeft = BUDGET.questions - used();
  const nb = notes();
  app.innerHTML = `
    <div class="top">
      <div class="top-row">
        <button class="back" id="back">${T.back}</button>
        <div class="budgets">
          <span class="chip ${eyeLeft ? "" : "empty"}">${T.eye} <b>${eyeLeft}</b>/${BUDGET.eye}</span>
          <span class="chip ${qLeft ? "" : "empty"}">${T.questions} <b>${qLeft}</b>/${BUDGET.questions}</span>
        </div>
      </div>
      <div class="tabs" role="tablist">
        ${[["scena", T.tabs[0]], ["sospetti", T.tabs[1]], ["taccuino", T.tabs[2], nb.length], ["accusa", T.tabs[3]]].map(([k, l, n]) =>
          `<button class="tab" role="tab" aria-selected="${S.tab === k}" data-tab="${k}">${l}${n ? `<span class="count">${n}</span>` : ""}</button>`).join("")}
      </div>
    </div>
    <div class="case-title">
      ${c.img && c.img.cover ? `<img class="cover" src="${c.img.cover}" alt="">` : ""}
      <span class="eyebrow">${S.daily ? T.dailyN(S.num) : T.arch} · ${esc(c.place)}</span>
      <h2>${esc(c.title)}</h2>
    </div>
    ${S.tab === "scena" ? scena(eyeLeft) : S.tab === "sospetti" ? sospetti(qLeft) : S.tab === "taccuino" ? taccuino(nb, qLeft) : accusa(nb)}`;
  app.querySelector("#back").onclick = home;
  app.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { S.tab = b.dataset.tab; S.flash = null; S.sel = []; render(); });
  bind();
}

function scena(eyeLeft) {
  const c = S.c;
  return `<section class="panel">
    <p class="lede">${esc(c.intro)}</p>
    <p class="hint">${T.sceneHint(eyeLeft)}</p>
    ${c.details.map(d => {
      const seen = S.seen.includes(d.id), locked = !seen && eyeLeft === 0;
      return `<button class="detail ${seen ? "seen reveal" : ""} ${locked ? "locked" : ""}" data-detail="${d.id}" ${seen || locked ? "disabled" : ""}>
        <div class="lbl">${esc(d.label)}<span>${seen ? T.seen : locked ? T.eyeOut : T.examine}</span></div>
        ${seen ? `<div class="txt">${esc(d.text)}</div>` : ""}
      </button>`;
    }).join("")}
  </section>`;
}

function sospetti(qLeft) {
  const c = S.c;
  return `<section class="panel">
    <p class="hint">${T.susHint(BUDGET.questions, qLeft)}</p>
    ${c.suspects.map(s => {
      const h = hardCount(s.id), closed = h >= BUDGET.hard;
      return `
      <article class="suspect">
        <div class="suspect-head ${pic(c, s.id) ? "has-portrait" : ""}">
          ${pic(c, s.id) ? `<img class="portrait" src="${pic(c, s.id)}" alt="${esc(T.portrait(s.name))}">` : ""}
          <span class="role">${esc(s.role)}</span>
          <h3>${esc(s.name)}</h3>
          <p>${esc(s.look)}</p>
          <div class="pressure" aria-label="${T.pressure} ${h}/${BUDGET.hard}">${T.pressure} ${Array.from({ length: BUDGET.hard }, (_, k) => `<i class="${k < h ? "on" : ""}"></i>`).join("")}</div>
        </div>
        <div class="suspect-body">
          ${S.read.includes(s.id)
            ? `<div class="reading reveal"><b>${T.reading}</b>${esc(s.tell)}</div>`
            : `<button class="act" data-read="${s.id}"><span class="tag">${T.free}</span>${T.observe}</button>`}
          ${s.questions.map(q => {
            if (S.asked.includes(q.id)) return `<div class="exchange reveal"><div class="q">${esc(q.q)}</div><div class="a">«${esc(q.a)}»${q.aside ? `<i>${esc(q.aside)}</i>` : ""}</div></div>`;
            if (closed || !(q.req || []).every(have)) return "";
            return `<button class="act" data-ask="${q.id}" ${qLeft ? "" : "disabled"}>${q.req ? `<span class="tag">${T.direct}</span>` : ""}${esc(q.q)}</button>`;
          }).join("")}
          ${closed ? `<div class="lawyer">${T.lawyer}</div>` : ""}
          ${c.contradictions.filter(x => x.who === s.id && S.found.includes(x.id)).map(x =>
            `<div class="exchange"><div class="q">${T.faced}</div><div class="a">«${esc(x.reply)}»${x.aside ? `<i>${esc(x.aside)}</i>` : ""}</div></div>`).join("")}
        </div>
      </article>`;
    }).join("")}
    <div class="bluff">
      <span class="eyebrow">${T.trick}</span>
      <h3>${T.bluff}</h3>
      <p>${esc(c.bluff.text)}</p>
      ${S.bluff
        ? `<div class="reactions reveal">${c.suspects.map(s => `<div><b>${esc(first(s))}:</b> ${esc(c.bluff.reactions[s.id])}</div>`).join("")}</div>`
        : `<button class="btn" id="bluff">${T.doBluff}</button>`}
    </div>
  </section>`;
}

function taccuino(nb, qLeft) {
  const f = S.flash;
  return `<section class="panel">
    ${f ? (f.hit
      ? `<div class="flash hit reveal"><span class="eyebrow">${esc(T.gives(f.who))}</span><div class="a">«${esc(f.reply)}»</div>${f.aside ? `<i>${esc(f.aside)}</i>` : ""}</div>`
      : `<div class="flash miss reveal">${T.miss}</div>`) : ""}
    <div class="notebook">
      <h3>${T.notebook}</h3>
      ${nb.length ? nb.map(n => `<button class="note" data-note="${n.id}" aria-pressed="${S.sel.includes(n.id)}"><span class="dot"></span><div><div class="src">${esc(n.src)}</div>${esc(n.text)}</div></button>`).join("")
        : `<p class="empty-nb">${T.emptyNb}</p>`}
    </div>
    ${nb.length > 1 ? `<div class="confront-bar">
      <span>${S.sel.length < 2 ? T.select(S.sel.length) : T.ready}</span>
      <button class="btn" id="confront" ${S.sel.length === 2 && qLeft > 0 ? "" : "disabled"}>${T.confront}</button>
    </div>` : ""}
  </section>`;
}

function accusa(nb) {
  const c = S.c, a = S.accuse;
  return `<section class="panel">
    <p class="hint">${T.accHint}</p>
    <span class="eyebrow">${T.culprit}</span>
    <div class="pick">${c.suspects.map(s => `<button class="opt" data-who="${s.id}" aria-pressed="${a.who === s.id}"><small>${esc(s.role)}</small>${esc(s.name)}</button>`).join("")}</div>
    <span class="eyebrow">${T.proof}</span>
    <div class="pick">${nb.length ? nb.map(n => `<button class="opt" data-ev="${n.id}" aria-pressed="${a.ev === n.id}"><small>${esc(n.src)}</small>${esc(n.text)}</button>`).join("")
      : `<p class="hint">${T.emptyProof}</p>`}</div>
    <span class="eyebrow">${T.motive}</span>
    <div class="pick">${c.motive.options.map((m, k) => `<button class="opt" data-mo="${k}" aria-pressed="${a.mo === k}">${esc(m)}</button>`).join("")}</div>
    <p class="hint">${T.firstOnly}</p>
    <button class="btn" id="accuse" ${a.who && a.mo !== null && (a.ev || !nb.length) ? "" : "disabled"}>${T.accuse}</button>
  </section>`;
}

function confront() {
  const [a, b] = S.sel;
  const x = S.c.contradictions.find(x => !S.found.includes(x.id) && ((x.a === a && x.b === b) || (x.a === b && x.b === a)));
  if (x) {
    S.found.push(x.id);
    const s = S.c.suspects.find(s => s.id === x.who);
    S.flash = { hit: true, who: first(s), reply: x.reply, aside: x.aside };
  } else {
    S.wrong++;
    S.flash = { hit: false };
  }
  S.sel = [];
  render();
  window.scrollTo(0, 0);
}

function bind() {
  app.querySelectorAll("[data-detail]").forEach(b => b.onclick = () => {
    if (S.seen.length < BUDGET.eye) { S.seen.push(b.dataset.detail); render(); }
  });
  app.querySelectorAll("[data-read]").forEach(b => b.onclick = () => { S.read.push(b.dataset.read); render(); });
  app.querySelectorAll("[data-ask]").forEach(b => b.onclick = () => {
    if (used() < BUDGET.questions) { S.asked.push(b.dataset.ask); render(); }
  });
  app.querySelectorAll("[data-note]").forEach(b => b.onclick = () => {
    const id = b.dataset.note;
    S.flash = null;
    if (S.sel.includes(id)) S.sel = S.sel.filter(x => x !== id);
    else S.sel = [...S.sel.slice(-1), id];
    render();
  });
  const cf = app.querySelector("#confront");
  if (cf) cf.onclick = confront;
  const bl = app.querySelector("#bluff");
  if (bl) bl.onclick = () => { S.bluff = true; render(); };
  app.querySelectorAll("[data-who]").forEach(b => b.onclick = () => { S.accuse.who = b.dataset.who; render(); });
  app.querySelectorAll("[data-ev]").forEach(b => b.onclick = () => { S.accuse.ev = b.dataset.ev; render(); });
  app.querySelectorAll("[data-mo]").forEach(b => b.onclick = () => { S.accuse.mo = +b.dataset.mo; render(); });
  const ac = app.querySelector("#accuse");
  if (ac) ac.onclick = result;
}

function result() {
  const c = S.c, a = S.accuse;
  const right = a.who === c.culprit;
  const proof = right && c.key.includes(a.ev);
  const why = right && a.mo === c.motive.correct;
  const stars = right ? 1 + (proof ? 1 : 0) + (why ? 1 : 0) : 0;
  const firsts = store.get("lettore-first") || {};
  const firstTry = !firsts[c.id];
  if (firstTry) { firsts[c.id] = { stars, used: used(), seen: S.seen.length, found: S.found.length, bluff: S.bluff }; store.set("lettore-first", firsts); }
  const rec = firsts[c.id];
  const culprit = c.suspects.find(s => s.id === c.culprit);
  const head = T.shareHead(S.daily, S.num, c.title);
  const share = `${head}\n${rec.stars ? "⭐".repeat(rec.stars) + "▫️".repeat(3 - rec.stars) : T.wrongShare}\n👁 ${rec.seen}/${BUDGET.eye} · ❓ ${rec.used}/${BUDGET.questions}${rec.found ? " · 💥".repeat(rec.found) : ""}${rec.bluff ? " · 🃏" : ""}\n${T.challenge}`;
  app.innerHTML = `
    <div class="top"><div class="top-row"><button class="back" id="back">${T.back}</button></div></div>
    <div class="result">
      <span class="eyebrow">${S.daily ? T.dailyN(S.num) : T.arch} · ${esc(c.title)}</span>
      <div class="verdict ${right ? "" : "bad"}">${right ? T.caught : T.innocent}</div>
      <div class="big-stars" aria-label="${T.stars(stars)}">${starStr(stars)}</div>
      <div class="score-lines">
        <div>${right ? esc(T.rightC(culprit.name)) : esc(T.wrongC(culprit.name))}</div>
        ${right ? `<div>${proof ? T.proofOk : T.proofNo}</div>` : ""}
        ${right ? `<div>${why ? T.whyOk : esc(T.whyNo(c.motive.options[c.motive.correct]))}</div>` : ""}
        <div>${T.used(used(), BUDGET.questions)}</div>
        ${firstTry ? "" : `<div>${T.offRank(rec.stars)}</div>`}
        ${S.found.length ? `<div>${T.xFound(S.found.length, c.contradictions.length)}</div>` : ""}
      </div>
      <div class="explain"><span class="eyebrow" style="color:var(--card-ink-2)">${T.how}</span><p>${esc(c.solution)}</p></div>
      <span class="eyebrow">${T.dare}</span>
      <textarea class="share-box" id="share" readonly>${esc(share)}</textarea>
      <div class="row">
        <button class="btn" id="copy">${T.copy}</button>
        <button class="btn ghost" id="retry">${T.retry}</button>
      </div>
      <div class="toast" id="toast" aria-live="polite"></div>
    </div>`;
  app.querySelector("#back").onclick = home;
  app.querySelector("#retry").onclick = () => start(S.i, S.daily);
  app.querySelector("#copy").onclick = () => {
    const t = app.querySelector("#toast"), box = app.querySelector("#share");
    const fallback = () => { box.focus(); box.select(); t.textContent = T.selected; };
    try {
      navigator.clipboard.writeText(share).then(() => { t.textContent = T.copied; }, fallback);
    } catch (e) { fallback(); }
  };
  window.scrollTo(0, 0);
}

home();
</script>
